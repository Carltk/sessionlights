# Every push and PR checks that the committed hooks/SHA256SUMS matches a fresh
# build, and that it still matches the published release of the version in
# plugin.json (changing the binaries without bumping the version would break
# fresh installs). A v* tag also publishes the binaries as a GitHub Release,
# which is where the plugin's launcher downloads them from.
#
# Release order matters, because the marketplace serves main: push the tag
# first, let this publish the release, then push main.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        run: |
          cp hooks/SHA256SUMS "$RUNNER_TEMP/committed.sums"
          sh tools/build.sh

      - name: Binaries match the committed checksums
        run: |
          if ! diff -u "$RUNNER_TEMP/committed.sums" hooks/SHA256SUMS; then
            echo "::error::hooks/SHA256SUMS is stale or the build is not reproducible. Run 'sh tools/build.sh' and commit hooks/SHA256SUMS."
            exit 1
          fi

      - name: Tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but plugin.json says $ver"
            exit 1
          fi

      - name: An existing release of this version has these exact binaries
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(jq -r .version .claude-plugin/plugin.json)
          if gh release download "v$ver" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O "$RUNNER_TEMP/release.sums" 2>/dev/null; then
            if ! diff -u "$RUNNER_TEMP/release.sums" hooks/SHA256SUMS; then
              echo "::error::v$ver is already released with other binaries. Bump the version in .claude-plugin/plugin.json."
              exit 1
            fi
          else
            echo "v$ver is not released yet: tag v$ver before pushing main, or installs will 404."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Artifacts match the committed checksums
        run: cd dist && sha256sum -c ../hooks/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp hooks/SHA256SUMS dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            dist/sessionlights-windows-amd64.exe dist/sessionlights-linux-amd64 dist/SHA256SUMS \
            --title "SessionLights $GITHUB_REF_NAME" --generate-notes
